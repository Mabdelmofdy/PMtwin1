<div class="page-container opportunities-page">
    <div id="page-context-header-mount"></div>
    <div class="page-body opportunities-page-body">
        <section class="opp-browser" aria-labelledby="opp-browser-heading">
            <div class="opp-toolbar">
                <div class="opp-toolbar__intro">
                    <h2 id="opp-browser-heading" class="opp-toolbar__title">Explore opportunities</h2>
                    <p class="opp-toolbar__lead">
                        Published needs and offers from the network. Use the shortcuts for yours or open listings—then narrow with filters or the map.
                    </p>
                </div>
                <a href="#" data-route="/opportunities/map" class="opp-map-link">
                    <i class="ph-duotone ph-map-trifold opp-map-link__icon" aria-hidden="true"></i>
                    <span class="opp-map-link__text">Map view</span>
                </a>
            </div>

            <div class="opp-quick" role="toolbar" aria-label="Quick category">
                <button type="button" class="opp-quick__btn" data-opp-cat="mine" id="opp-quick-mine">
                    <span class="opp-quick__icon-wrap" aria-hidden="true"><i class="ph-duotone ph-user-circle"></i></span>
                    <span class="opp-quick__text">
                        <span class="opp-quick__count" id="count-mine">0</span>
                        <span class="opp-quick__label">Mine</span>
                    </span>
                </button>
                <button type="button" class="opp-quick__btn" data-opp-cat="applied" id="opp-quick-applied">
                    <span class="opp-quick__icon-wrap" aria-hidden="true"><i class="ph-duotone ph-paper-plane-tilt"></i></span>
                    <span class="opp-quick__text">
                        <span class="opp-quick__count" id="count-applied">0</span>
                        <span class="opp-quick__label">Applied</span>
                    </span>
                </button>
                <button type="button" class="opp-quick__btn" data-opp-cat="available" id="opp-quick-available">
                    <span class="opp-quick__icon-wrap" aria-hidden="true"><i class="ph-duotone ph-globe"></i></span>
                    <span class="opp-quick__text">
                        <span class="opp-quick__count" id="count-available">0</span>
                        <span class="opp-quick__label">Open market</span>
                    </span>
                </button>
                <button type="button" class="opp-quick__btn is-active" data-opp-cat="all" id="opp-quick-all">
                    <span class="opp-quick__icon-wrap" aria-hidden="true"><i class="ph-duotone ph-squares-four"></i></span>
                    <span class="opp-quick__text">
                        <span class="opp-quick__label opp-quick__label--solo">All</span>
                    </span>
                </button>
            </div>

            <div class="opp-filters" role="search" aria-label="Filter opportunities">
                <div class="opp-filters__grid">
                    <div class="opp-field">
                        <label class="opp-field__label" for="filter-category">Category</label>
                        <select id="filter-category" class="opp-select">
                            <option value="">All categories</option>
                            <option value="mine">My opportunities</option>
                            <option value="applied">Applied</option>
                            <option value="available">Open market</option>
                        </select>
                    </div>
                    <div class="opp-field">
                        <label class="opp-field__label" for="filter-intent">Intent</label>
                        <select id="filter-intent" class="opp-select">
                            <option value="">Need &amp; offer</option>
                            <option value="request">Need</option>
                            <option value="offer">Offer</option>
                        </select>
                    </div>
                    <div class="opp-field opp-field--span2">
                        <label class="opp-field__label" for="filter-model">Collaboration model</label>
                        <select id="filter-model" class="opp-select">
                            <option value="">All models</option>
                            <optgroup label="Project-based collaboration">
                                <option value="task_based">Task-based engagement</option>
                                <option value="consortium">Consortium</option>
                                <option value="project_jv">Project-specific joint venture</option>
                                <option value="spv">Special purpose vehicle (SPV)</option>
                            </optgroup>
                            <optgroup label="Strategic partnerships">
                                <option value="strategic_jv">Strategic joint venture</option>
                                <option value="strategic_alliance">Long-term strategic alliance</option>
                                <option value="mentorship">Mentorship program</option>
                            </optgroup>
                            <optgroup label="Resource pooling &amp; sharing">
                                <option value="bulk_purchasing">Bulk purchasing</option>
                                <option value="equipment_sharing">Equipment sharing</option>
                                <option value="resource_sharing">Resource sharing &amp; exchange</option>
                            </optgroup>
                            <optgroup label="Hiring a resource">
                                <option value="professional_hiring">Professional hiring</option>
                                <option value="consultant_hiring">Consultant hiring</option>
                            </optgroup>
                            <optgroup label="Call for competition">
                                <option value="competition_rfp">Competition / RFP</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="opp-field">
                        <label class="opp-field__label" for="filter-status">Status</label>
                        <select id="filter-status" class="opp-select">
                            <option value="">All statuses</option>
                            <option value="draft">Draft</option>
                            <option value="published">Published</option>
                            <option value="in_negotiation">In negotiation</option>
                            <option value="contracted">Contracted</option>
                            <option value="in_execution">In execution</option>
                            <option value="completed">Completed</option>
                            <option value="closed">Closed</option>
                            <option value="cancelled">Cancelled</option>
                        </select>
                    </div>
                    <div class="opp-field">
                        <label class="opp-field__label" for="filter-search">Search</label>
                        <input type="search" id="filter-search" class="opp-input" placeholder="Title or description…" autocomplete="off" />
                    </div>
                    <div class="opp-filters__reset">
                        <button type="button" id="clear-filters" class="btn btn-secondary btn-sm">Reset filters</button>
                    </div>
                </div>
            </div>

            <p id="opportunities-summary" class="opp-summary" aria-live="polite"></p>

            <div id="opportunities-panel-wrap" class="opp-panel-wrap">
                <div id="opportunities-list" class="opp-list" role="list">
                    <div class="spinner"></div>
                </div>
            </div>
        </section>
    </div>
</div>
