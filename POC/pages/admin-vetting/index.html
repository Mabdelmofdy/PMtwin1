<div class="page-container admin-vetting-page">
    <div id="page-context-header-mount"></div>
    <div class="page-body admin-vetting-body">

        <!-- Summary strip -->
        <section class="vetting-summary" aria-labelledby="vetting-summary-title">
            <h2 id="vetting-summary-title" class="sr-only">Queue summary</h2>
            <div class="vetting-summary-grid">
                <div class="vetting-summary-card">
                    <span class="vetting-summary-label">In queue</span>
                    <span class="vetting-summary-value" id="vetting-stat-total">0</span>
                    <span class="vetting-summary-hint">Pending review + waiting for updates</span>
                </div>
                <div class="vetting-summary-card">
                    <span class="vetting-summary-label">Pending review</span>
                    <span class="vetting-summary-value" id="vetting-stat-pending">0</span>
                    <span class="vetting-summary-hint">Awaiting first decision</span>
                </div>
                <div class="vetting-summary-card">
                    <span class="vetting-summary-label">Waiting for updates</span>
                    <span class="vetting-summary-value" id="vetting-stat-clarif">0</span>
                    <span class="vetting-summary-hint">Applicant must update and resubmit</span>
                </div>
                <div class="vetting-summary-card">
                    <span class="vetting-summary-label">Oldest waiting</span>
                    <span class="vetting-summary-value" id="vetting-stat-oldest">—</span>
                    <span class="vetting-summary-hint" id="vetting-stat-oldest-hint">Time in queue</span>
                </div>
            </div>
        </section>

        <!-- Filters & search -->
        <section class="vetting-toolbar" aria-labelledby="vetting-filters-title">
            <h2 id="vetting-filters-title" class="sr-only">Filters</h2>

            <div class="vetting-segmented" role="tablist" aria-label="Status filter">
                <button type="button" class="vetting-seg is-active" data-status-filter="" role="tab" aria-selected="true">
                    <span class="vetting-seg-label">All</span>
                    <span class="vetting-seg-count" id="chip-count-all">0</span>
                </button>
                <button type="button" class="vetting-seg" data-status-filter="pending" role="tab" aria-selected="false">
                    <span class="vetting-seg-label">Pending</span>
                    <span class="vetting-seg-count" id="chip-count-pending">0</span>
                </button>
                <button type="button" class="vetting-seg" data-status-filter="clarification_requested" role="tab" aria-selected="false">
                    <span class="vetting-seg-label">Waiting for updates</span>
                    <span class="vetting-seg-count" id="chip-count-clarif">0</span>
                </button>
            </div>

            <div class="vetting-toolbar-row">
                <div class="vetting-search">
                    <i class="ph-duotone ph-magnifying-glass" aria-hidden="true"></i>
                    <input
                        type="text"
                        id="filter-search"
                        class="vetting-search-input"
                        placeholder="Search by name or email"
                        aria-label="Search by name or email"
                    >
                </div>
                <select id="filter-type" class="vetting-select" aria-label="Account type">
                    <option value="">All accounts</option>
                    <option value="individual">Individuals</option>
                    <option value="company">Companies</option>
                </select>
                <select id="filter-sort" class="vetting-select" aria-label="Sort order">
                    <option value="oldest">Oldest waiting first</option>
                    <option value="newest">Newest first</option>
                    <option value="updated_desc">Last updated (newest)</option>
                    <option value="updated_asc">Last updated (oldest)</option>
                    <option value="type">Account type</option>
                </select>
            </div>
        </section>

        <!-- Bulk action bar -->
        <section class="vetting-bulk-bar" id="vetting-bulk-actions" hidden aria-live="polite">
            <div class="vetting-bulk-bar-info">
                <label class="vetting-bulk-bar-select-label">
                    <input type="checkbox" id="vetting-select-all" />
                    <span><strong id="vetting-bulk-count">0</strong> selected</span>
                </label>
            </div>
            <div class="vetting-bulk-bar-actions">
                <button type="button" id="vetting-approve-selected" class="btn btn-success btn-sm-touch">
                    <i class="ph-duotone ph-check-circle" aria-hidden="true"></i>
                    <span>Approve</span>
                </button>
                <button type="button" id="vetting-clarify-selected" class="btn btn-warning btn-sm-touch">
                    <i class="ph-duotone ph-info" aria-hidden="true"></i>
                    <span>Request updates</span>
                </button>
                <button type="button" id="vetting-reject-selected" class="btn btn-danger btn-sm-touch">
                    <i class="ph-duotone ph-x-circle" aria-hidden="true"></i>
                    <span>Reject</span>
                </button>
            </div>
        </section>

        <!-- Queue -->
        <section class="vetting-queue" aria-labelledby="vetting-queue-title">
            <div class="vetting-queue-head">
                <h2 id="vetting-queue-title" class="vetting-queue-title">Review queue</h2>
                <p class="vetting-queue-meta" id="vetting-queue-meta">Loading queue…</p>
            </div>
            <div id="vetting-list" class="vetting-list">
                <div class="spinner"></div>
            </div>
        </section>

    </div>
</div>
