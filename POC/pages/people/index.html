<div class="page-container people-page">

                    </div>

                                <input type="checkbox" name="type" value="professional">
                                <span class="people-type-option__ui">Professionals</span>
                            </label>
                            <label class="people-type-option">
                                <input type="checkbox" name="type" value="company">
                                <span class="people-type-option__ui">Companies</span>
                            </label>
                        </div>
                        <p class="people-hint">Leave both off to include everyone.</p>

                    <div class="people-field people-field--split">

                                <option value="Limited">Limited</option>
                            </select>
                        </div>
                    </div>

                        <div class="people-skills-head">
                            <label class="people-label" id="people-skills-label" for="skills-dropdown-trigger">Skills</label>
                            <button type="button" id="clear-skills-inline" class="people-skills-clear" hidden>Clear</button>
                        </div>
                        <div id="people-skills-preview" class="people-skills-preview" hidden aria-live="polite"></div>
                        <span id="people-skills-sr-hint" class="people-sr-only">Open the menu and toggle skills with Enter or Space when focused.</span>
                        <div class="people-skills-dropdown" id="people-skills-dropdown">
                            <button type="button" id="skills-dropdown-trigger" class="people-skills-trigger" aria-expanded="false" aria-haspopup="listbox" aria-controls="skills-dropdown-menu" aria-describedby="people-skills-sr-hint">
                                <span class="people-skills-trigger__text" id="skills-dropdown-label">Select skills…</span>
                                <i class="ph-duotone ph-caret-down people-skills-trigger__caret" aria-hidden="true"></i>
                            </button>
                            <div id="skills-dropdown-menu" class="people-skills-menu" hidden role="listbox" aria-labelledby="people-skills-label" aria-multiselectable="true">
                                <div class="people-skills-search">
                                    <i class="ph-duotone ph-magnifying-glass people-skills-search__icon" aria-hidden="true"></i>
                                    <input type="text" id="skills-query" class="people-skills-search__input" placeholder="Search skills…" autocomplete="off" enterkeyhint="search" aria-label="Filter skills by name">
                                </div>
                                <div class="people-skills-menu__body">
                                    <div id="skills-filter" class="skills-list"></div>
                                    <p id="people-skills-empty" class="people-skills-empty" hidden>No skills match your search</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="people-actions">
                    <button type="button" id="clear-skills" class="people-reset">Clear skills</button>
                    <button type="button" id="reset-filters" class="people-reset people-reset--primary">Clear all</button>
                </div>
            </aside>

            <section class="people-results" aria-label="Search results">
                <div class="people-results__head">
                    <div class="people-segments" id="people-tabs" role="tablist" aria-label="People view">
                        <button class="people-tab" type="button" role="tab" data-tab="network" id="people-tab-network" aria-selected="false" aria-controls="people-list">
                            <span class="people-tab__icon" aria-hidden="true"><i class="ph-duotone ph-users-three"></i></span>
                            <span class="people-tab__text">
                                <span class="people-tab__count" id="network-count">0</span>
                                <span class="people-tab__label">My Network</span>
                            </span>
                        </button>
                        <button class="people-tab active" type="button" role="tab" data-tab="discover" id="people-tab-discover" aria-selected="true" aria-controls="people-list">
                            <span class="people-tab__icon" aria-hidden="true"><i class="ph-duotone ph-compass"></i></span>
                            <span class="people-tab__text">
                                <span class="people-tab__count" id="discover-count">0</span>
                                <span class="people-tab__label">Discover</span>
                            </span>
                        </button>
                    </div>
                    <header class="people-results__toolbar">
                        <p id="results-count" class="people-summary" aria-live="polite" aria-atomic="true">
                            <span class="people-summary__value">—</span>
                        </p>
                        <div class="people-sort">
                            <label class="people-sort-label" for="sort-people">Sort</label>
                            <div class="people-sort__select">
                                <select id="sort-people" class="form-select people-control people-control--sort">
                                    <option value="connections">Most connections</option>
                                    <option value="name">Name (A–Z)</option>
                                    <option value="experience">Experience</option>
                                    <option value="recent">Recently joined</option>
                                </select>
                                <i class="ph-duotone ph-caret-down people-sort__caret" aria-hidden="true"></i>
                            </div>
                        </div>
                    </header>
                </div>

                <div id="people-list" class="people-list" role="tabpanel" aria-labelledby="people-tab-discover">
                    <div class="people-list__loading" aria-busy="true">
                        <div class="spinner" aria-label="Loading results"></div>
                    </div>
                </div>
            </section>
        </div>
    </div>
</div>
